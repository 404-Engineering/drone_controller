<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="700" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d2433">Drone Controller (vehicle comm board) wiring</text>
  <text x="550" y="60" text-anchor="middle" font-size="13" fill="#5b6475">Pin labels are GPIO numbers (GPx), physical header pin in brackets</text>

  <!-- ===== GPS module ===== -->
  <rect x="40" y="120" width="170" height="220" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="2"/>
  <text x="125" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">GPS module</text>
  <g font-size="13" fill="#1d2433" text-anchor="end">
    <text x="198" y="155">5V</text>
    <text x="198" y="195">GND</text>
    <text x="198" y="235">TX</text>
    <text x="198" y="275">RX</text>
    <text x="198" y="315">PPS</text>
  </g>

  <!-- ===== Pico 2 W ===== -->
  <rect x="360" y="90" width="340" height="440" rx="10" fill="#e9f5ee" stroke="#0a6939" stroke-width="2.5"/>
  <rect x="500" y="70" width="60" height="24" rx="4" fill="#c9ced6" stroke="#5b6475"/>
  <text x="530" y="87" text-anchor="middle" font-size="11" fill="#1d2433">USB-C</text>
  <text x="530" y="490" text-anchor="middle" font-size="17" font-weight="bold" fill="#0a6939">Pico 2 W</text>
  <text x="530" y="508" text-anchor="middle" font-size="12" fill="#0a6939">RP2350 + CYW43439</text>
  <text x="530" y="524" text-anchor="middle" font-size="11" fill="#5b6475">GP23/24/25/29 used by radio</text>

  <!-- left-side pins -->
  <g font-size="13" fill="#1d2433">
    <text x="372" y="155">VBUS [40]</text>
    <text x="372" y="195">GND [38]</text>
    <text x="372" y="235">GP1 UART0 RX [2]</text>
    <text x="372" y="275">GP0 UART0 TX [1]</text>
    <text x="372" y="315">GP2 [4]</text>
    <text x="372" y="475">GP22 [29]</text>
  </g>
  <!-- right-side pins -->
  <g font-size="13" fill="#1d2433" text-anchor="end">
    <text x="688" y="155">3V3(OUT) [36]</text>
    <text x="688" y="195">GND [23]</text>
    <text x="688" y="235">GP18 SPI0 SCK [24]</text>
    <text x="688" y="275">GP19 SPI0 TX [25]</text>
    <text x="688" y="315">GP16 SPI0 RX [21]</text>
    <text x="688" y="355">GP17 CSN [22]</text>
    <text x="688" y="395">GP20 CE [26]</text>
    <text x="688" y="435">GP21 IRQ [27]</text>
  </g>

  <!-- ===== NRF24L01+ PA/LNA ===== -->
  <rect x="870" y="120" width="170" height="340" rx="8" fill="#fbefe6" stroke="#c0571d" stroke-width="2"/>
  <text x="955" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2433">NRF24L01+ PA/LNA</text>
  <g font-size="13" fill="#1d2433">
    <text x="882" y="155">VCC (3.3V)</text>
    <text x="882" y="195">GND</text>
    <text x="882" y="235">SCK</text>
    <text x="882" y="275">MOSI</text>
    <text x="882" y="315">MISO</text>
    <text x="882" y="355">CSN</text>
    <text x="882" y="395">CE</text>
    <text x="882" y="435">IRQ</text>
  </g>
  <line x1="1040" y1="290" x2="1065" y2="290" stroke="#b8941f" stroke-width="5"/>
  <text x="1065" y="280" text-anchor="end" font-size="10" fill="#5b6475">SMA</text>

  <!-- ===== GPS wires ===== -->
  <g stroke-width="2.5" fill="none">
    <line x1="210" y1="150" x2="360" y2="150" stroke="#d62d2d"/>
    <line x1="210" y1="190" x2="360" y2="190" stroke="#1d2433"/>
    <line x1="210" y1="230" x2="360" y2="230" stroke="#2f6db5"/>
    <line x1="210" y1="270" x2="360" y2="270" stroke="#7b4fb5"/>
    <line x1="210" y1="310" x2="360" y2="310" stroke="#3a9a5b"/>
  </g>
  <g font-size="10" fill="#5b6475" text-anchor="middle">
    <text x="285" y="225">GPS TX → Pico RX</text>
    <text x="285" y="265">Pico TX → GPS RX</text>
    <text x="285" y="305">1 pulse/s (optional)</text>
  </g>

  <!-- ===== NRF wires ===== -->
  <g stroke-width="2.5" fill="none">
    <line x1="700" y1="150" x2="870" y2="150" stroke="#d62d2d"/>
    <line x1="700" y1="190" x2="870" y2="190" stroke="#1d2433"/>
    <line x1="700" y1="230" x2="870" y2="230" stroke="#2f6db5"/>
    <line x1="700" y1="270" x2="870" y2="270" stroke="#3a9a5b"/>
    <line x1="700" y1="310" x2="870" y2="310" stroke="#7b4fb5"/>
    <line x1="700" y1="350" x2="870" y2="350" stroke="#c0571d"/>
    <line x1="700" y1="390" x2="870" y2="390" stroke="#b8941f"/>
    <line x1="700" y1="430" x2="870" y2="430" stroke="#6b7280"/>
  </g>

  <!-- decoupling caps across NRF VCC/GND, at the module -->
  <g stroke="#1d2433" stroke-width="2" fill="none">
    <line x1="780" y1="150" x2="780" y2="164"/>
    <line x1="768" y1="164" x2="792" y2="164" stroke-width="3"/>
    <path d="M768 176 Q780 170 792 176" stroke-width="3"/>
    <line x1="780" y1="173" x2="780" y2="190"/>
    <line x1="830" y1="150" x2="830" y2="164"/>
    <line x1="818" y1="164" x2="842" y2="164" stroke-width="3"/>
    <line x1="818" y1="174" x2="842" y2="174" stroke-width="3"/>
    <line x1="830" y1="174" x2="830" y2="190"/>
  </g>
  <g fill="#1d2433">
    <circle cx="780" cy="150" r="3.5"/><circle cx="780" cy="190" r="3.5"/>
    <circle cx="830" cy="150" r="3.5"/><circle cx="830" cy="190" r="3.5"/>
  </g>
  <text x="780" y="210" text-anchor="middle" font-size="10" fill="#1d2433">100µF</text>
  <text x="830" y="210" text-anchor="middle" font-size="10" fill="#1d2433">100nF</text>

  <!-- ===== optional kill button ===== -->
  <g stroke="#1d2433" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <line x1="360" y1="470" x2="300" y2="470"/>
    <line x1="300" y1="470" x2="300" y2="490"/>
    <line x1="300" y1="530" x2="300" y2="555"/>
  </g>
  <g stroke="#1d2433" stroke-width="2" fill="none">
    <circle cx="300" cy="493" r="3"/>
    <circle cx="300" cy="527" r="3"/>
    <line x1="290" y1="488" x2="290" y2="532"/>
    <line x1="290" y1="510" x2="276" y2="510"/>
    <line x1="284" y1="555" x2="316" y2="555"/>
    <line x1="290" y1="561" x2="310" y2="561"/>
    <line x1="296" y1="567" x2="304" y2="567"/>
  </g>
  <text x="240" y="514" text-anchor="end" font-size="12" fill="#1d2433">KILL button</text>
  <text x="240" y="530" text-anchor="end" font-size="10" fill="#5b6475">optional, to GND</text>

  <!-- ===== notes ===== -->
  <g font-size="12" fill="#1d2433">
    <text x="40" y="600" font-weight="bold">Notes</text>
    <text x="40" y="620">• NRF24 VCC is 3.3 V only. Put the 100µF + 100nF right at the module pins; the PA draws current spikes on transmit.</text>
    <text x="40" y="640">• VBUS is 5 V only while USB is plugged in. If the board is later powered from the jeep's 12 V, feed GPS 5V from that regulator instead.</text>
    <text x="40" y="660">• Measure the GPS TX idle level before connecting: it should be ≈3.3 V. Keep the NRF antenna away from the GPS antenna.</text>
    <text x="40" y="680">• SPI0 and UART0 (Serial1) use the Arduino core's default pins, so no pin remapping is needed in firmware.</text>
  </g>
</svg>
