; PlatformIO project for the vehicle comm board (drone controller): Pico 2 W
; (USB-C variant, standard Pico 2 W pinout) + NRF24L01+PA/LNA + GPS. Uses the
; community RP2040/RP2350 platform with Earle Philhower's Arduino core, which
; supports the Pico 2 W (RP2350 + CYW43439).

[platformio]
default_envs = rpipico2w

[env:rpipico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Enables the CYW43439 Bluetooth stack (Classic + BLE) for future gamepad support.
build_flags = -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    nrf24/RF24 @ ^1.6.2

; Host-side unit tests for code that doesn't depend on the Arduino core
; (lib/LinkAuth). Run with: pio test -e native
[env:native]
platform = native
test_framework = unity