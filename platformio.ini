; PlatformIO project for the vehicle comm board (drone controller): Pimoroni
; Pico Plus 2 W + NRF24L01+PA/LNA + GPS. Uses the community RP2040/RP2350
; platform with Earle Philhower's Arduino core, which supports the Pico Plus 2 W
; (RP2350B + RM2 / CYW43439, USB-C).

[env:pimoroni_pico_plus_2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pimoroni_pico_plus_2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; Enables the CYW43439 Bluetooth stack (Classic + BLE) for future gamepad support.
build_flags = -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
